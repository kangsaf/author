version: "3.9"
services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python","run.py","--mode","bot"]
    healthcheck:
      test: ["CMD","python","-c","import importlib,sys; importlib.import_module('run'); print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 5

  ui:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python","run.py","--mode","streamlit"]
    ports:
      - "8501:8501"
    depends_on:
      bot:
        condition: service_healthy
